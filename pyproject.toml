[project]
name = "it-helpdesk-assistant"
version = "0.1.0"
description = "Enterprise IT Helpdesk AI Assistant built with Google Agent Development Kit (ADK), Vertex Memory Bank, and Model Armor guardrails."
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "google-genai>=0.1.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "gcsfs>=2024.11.0",
    "google-adk>=1.15.0,<2.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
